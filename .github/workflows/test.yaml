name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.21"
          python-version: "3.11.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile contracts
        run: uv run --locked vesting-escrow-compile

      - name: Run functional tests
        run: uv run --locked pytest tests/functional/ --gas-profile

      - name: Run property tests
        run: uv run --locked pytest tests/integration/

      - name: Build package
        run: uv build

      - name: Smoke test installed wheel
        run: |
          uvx --from ./dist/yearn_vesting_escrow-0.4.0-py3-none-any.whl vesting-escrow-compile
          uvx --from ./dist/yearn_vesting_escrow-0.4.0-py3-none-any.whl vesting-escrow-deploy
